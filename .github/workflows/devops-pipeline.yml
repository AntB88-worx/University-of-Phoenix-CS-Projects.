name: DevOps & Cloud Infrastructure CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate-and-build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    - name: Initialize Python Runtime
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Run Syntax and Quality Linting (Flake8)
      run: |
        pip install flake8
        flake8 . --count --exclude=Core-Utilities,CSS-200T,Network-Infrastructure,Inventory-Automation --select=E9,F63,F7,F82 --show-source --statistics

        # 🔒 DEVSECOPS STEP: Scan Python code for security bugs/vulnerabilities (Skipping B311 crypto warning)
    - name: Run Automated Security Scan (Bandit)
      run: |
        pip install bandit
        bandit -r ./Phase1-Container-Stream ./Phase2-Cloud-Serverless -s B311

    - name: Validate and Build Phase 1 Docker Image
      run: |
        cd Phase1-Container-Stream
        docker build -t inventory-stream-pipeline:latest .
